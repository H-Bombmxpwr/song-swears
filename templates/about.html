<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <link rel="icon" href="https://e7.pngegg.com/pngimages/941/502/png-clipart-profanity-word-english-swearing-s-english-text.png">
    <title>Song Swears - About</title>
</head>
<body>
    <div class="main-content">
        <h1 class="title">About</h1>

        <div class="about-container">
            <p class="made-by-label">made by</p>
            <div class="retro">
                <h1>Hunter</h1>
            </div>

            <p class="about_txt">
                A retro-styled web app that analyzes song lyrics for explicit content.
            </p>

            <div class="api-links">
                <p class="powered-by">Powered by</p>
                <div class="link-list">
                    <a href="https://developer.spotify.com/documentation/web-api" target="_blank" rel="noopener noreferrer" class="api-link spotify-link">Spotify API</a>
                    <a href="https://lyricsovh.docs.apiary.io/" target="_blank" rel="noopener noreferrer" class="api-link lyrics-link">Lyrics.ovh API</a>
                </div>
            </div>

            <div class="personal-links">
                <a href="https://home.hxr.life/" target="_blank" rel="noopener noreferrer" class="website-link">home.hxr.life</a>
            </div>

            <a href="{{ url_for('home') }}" class="about-link">Back to homepage</a>
        </div>
    </div>

    <style>
        .about-container {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .made-by-label {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: -10px;
        }

        .retro {
            margin: 20px 0 30px 0;
        }

        .retro h1 {
            font-size: clamp(3em, 12vw, 8em);
        }

        .api-links {
            margin: 30px 0;
        }

        .powered-by {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .link-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .api-link {
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .spotify-link {
            background: linear-gradient(135deg, #1DB954 0%, #1aa34a 100%);
            color: white;
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.4);
        }

        .spotify-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(29, 185, 84, 0.6);
        }

        .lyrics-link {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.4);
        }

        .lyrics-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.6);
        }

        .personal-links {
            margin: 30px 0;
        }

        .website-link {
            display: inline-block;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(254, 5, 225, 0.5);
            border-radius: 30px;
            color: #fe05e1;
            text-decoration: none;
            font-weight: 700;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .website-link:hover {
            background: rgba(254, 5, 225, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(254, 5, 225, 0.4);
        }
    </style>
</body>
</html>
